<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="110%" r="70%">
      <stop offset="0%" stop-color="#1B3FA3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#141720" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#141720"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Precision framing rules -->
  <line x1="60" y1="80" x2="1140" y2="80" stroke="#D5DCF0" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="60" y1="550" x2="1140" y2="550" stroke="#D5DCF0" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Corner tick marks — precision instrument feel -->
  <line x1="60" y1="80" x2="60" y2="100" stroke="#D87030" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="1140" y1="80" x2="1140" y2="100" stroke="#D87030" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="60" y1="550" x2="60" y2="530" stroke="#D87030" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="1140" y1="550" x2="1140" y2="530" stroke="#D87030" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Logo mark — centered at (600, 222), scaled 3.5× from 36px original -->
  <g transform="translate(537, 159) scale(3.5)">
    <rect width="36" height="36" rx="9" fill="#1D2130"/>
    <line x1="10" y1="8" x2="10" y2="27" stroke="#D87030" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="27" x2="28" y2="27" stroke="#D87030" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 22 L15 22 L15 27" stroke="#D87030" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
    <line x1="10" y1="12" x2="13" y2="12" stroke="#D87030" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="17" x2="13" y2="17" stroke="#D87030" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="15" y1="27" x2="15" y2="25" stroke="#D87030" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="19" y1="27" x2="19" y2="25" stroke="#D87030" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="27" x2="23" y2="25" stroke="#D87030" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- "LoanCalc" wordmark -->
  <text x="600" y="362" font-family="Barlow, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="700" text-anchor="middle" letter-spacing="-2" fill="#F2F1EC">Loan<tspan fill="#D87030">Calc</tspan></text>

  <!-- Tagline -->
  <text x="600" y="408" font-family="Barlow, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="300" fill="#F2F1EC" fill-opacity="0.55" text-anchor="middle" letter-spacing="0.5">Free Financial Calculators</text>

  <!-- Feature row -->
  <text x="600" y="460" font-family="Barlow, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#D87030" fill-opacity="0.65" text-anchor="middle" letter-spacing="3">LOANS · MORTGAGES · SAVINGS · CURRENCY · REFINANCE</text>

  <!-- URL stamp -->
  <text x="1128" y="568" font-family="Barlow, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#F2F1EC" fill-opacity="0.28" text-anchor="end">loancalc.app</text>
</svg>
